<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کوئز رزلٹ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Nastaliq Urdu', sans-serif;
        }

        body {
            background-color: #030a16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .result-card {
            background: linear-gradient(180deg, #06152d 0%, #020813 100%);
            border: 2px solid #cca43b;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(204, 164, 59, 0.2);
            text-align: center;
        }

        .top-badge {
            background: linear-gradient(90deg, #102a43, #1e425e);
            border: 1px solid #cca43b;
            border-radius: 30px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .top-badge .lock-icon {
            color: #f39c12;
            font-size: 16px;
        }

        .trophy-icon {
            font-size: 50px;
            color: #f1c40f;
            filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.5));
            margin-bottom: 10px;
        }

        .main-title {
            font-size: 26px;
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .name-box {
            border: 1px solid #cca43b;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.03);
            text-align: right;
        }

        .user-avatar {
            background: #f1c40f;
            color: #000;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .name-label { font-size: 11px; color: #aaa; }
        .user-name { font-size: 16px; font-weight: bold; color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-percentage { background: rgba(14, 165, 233, 0.1); border-color: #0ea5e9; }
        .stat-wrong { background: rgba(239, 68, 68, 0.1); border-color: #ef4444; }
        .stat-right { background: rgba(34, 197, 94, 0.1); border-color: #22c55e; }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .stat-value { font-size: 18px; font-weight: bold; direction: ltr; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-icon {
            background: #1e3a5f;
            color: #38bdf8;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-text { text-align: right; }
        .info-title { font-size: 11px; color: #94a3b8; }
        .info-val { font-size: 12px; font-weight: bold; color: #fff; direction: ltr; }

        .security-box {
            border: 1px solid #22c55e;
            background: rgba(34, 197, 94, 0.05);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .sec-left { display: flex; align-items: center; gap: 10px; }
        .sec-icon {
            background: #22c55e;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hash-code {
            border: 1px solid #22c55e;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 11px;
            color: #22c55e;
            font-weight: bold;
        }

        .sec-right { text-align: left; font-size: 11px; }
        .sec-right .status { color: #22c55e; font-weight: bold; }
        .sec-right .sub { color: #94a3b8; font-size: 9px; }

        .btn-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 25px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            font-size: 12px;
            text-decoration: none;
        }

        .btn-download { background: #0284c7; }
        .btn-share { background: #16a34a; }
    </style>
</head>
<body>

    <div class="result-card">
        <div class="top-badge">
            <span>امتحان مکمل • آپ کامیابی کے ساتھ پاس ہو گئے!</span>
            <i class="fa-solid fa-lock lock-icon"></i>
        </div>

        <div class="trophy-container">
            <i class="fa-solid fa-trophy trophy-icon"></i>
            <h1 class="main-title">زبردست!</h1>
            <p class="subtitle">آپ نے شاندار کارکردگی کا مظاہرہ کیا ہے</p>
        </div>

        <div class="name-box">
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
            <div>
                <div class="name-label">نام:</div>
                <div class="user-name" id="resStudentName">---</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box stat-percentage">
                <div class="stat-header"><span>فیصد</span></div>
                <div class="stat-value" id="resPercentage">0%</div>
            </div>
            <div class="stat-box stat-wrong">
                <div class="stat-header"><span>غلط</span></div>
                <div class="stat-value" id="resWrong">0 /15</div>
            </div>
            <div class="stat-box stat-right">
                <div class="stat-header"><span>صحیح</span></div>
                <div class="stat-value" id="resRight">0 /15</div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-box">
                <div class="info-icon"><i class="fa-solid fa-star"></i></div>
                <div class="info-text">
                    <div class="info-title">کل سوالات</div>
                    <div class="info-val" id="resTotal">15</div>
                </div>
            </div>
            <div class="info-box">
                <div class="info-icon"><i class="fa-solid fa-calendar-days"></i></div>
                <div class="info-text">
                    <div class="info-title">وقت</div>
                    <div class="info-val" id="resDate" style="font-size: 9px;">---</div>
                </div>
            </div>
        </div>

        <div class="security-box">
            <div class="sec-left">
                <div class="sec-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <div style="text-align: right;">
                    <div style="font-size: 9px; color: #aaa;">Security Hash</div>
                    <div class="hash-code" id="resHash">SK-15Q-000000</div>
                </div>
            </div>
            <div class="sec-right">
                <div class="status"><i class="fa-solid fa-lock"></i> محفوظ رزلٹ</div>
                <div class="sub">(Verified & Encrypted)</div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-download" onclick="window.print()">
                <i class="fa-solid fa-print"></i> پرنٹ / ڈاؤن لو
            </button>
            <button class="btn btn-share" onclick="shareWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> واٹس ایپ شیئر
            </button>
        </div>
    </div>

    <script>
        const name = localStorage.getItem("studentName") || "Student";
        const score = parseInt(localStorage.getItem("score")) || 0;
        const total = parseInt(localStorage.getItem("total")) || 15;
        const wrong = total - score;
        const percent = Math.round((score / total) * 100);

        document.getElementById("resStudentName").innerText = name;
        document.getElementById("resRight").innerText = score + " /" + total;
        document.getElementById("resWrong").innerText = wrong + " /" + total;
        document.getElementById("resTotal").innerText = total;
        document.getElementById("resPercentage").innerText = percent + "%";

        const randomHash = "SK-" + total + "Q-" + Math.random().toString(16).substring(2, 8).toUpperCase();
        document.getElementById("resHash").innerText = randomHash;

        const dateStr = new Date().toLocaleString();
        document.getElementById("resDate").innerText = dateStr;

        function shareWhatsApp() {
    // 1. Data collect karna
    const name = localStorage.getItem("studentName") || "Student";
    const score = parseInt(localStorage.getItem("score")) || 0;
    const total = parseInt(localStorage.getItem("total")) || 15;
    const percent = Math.round((score / total) * 100);
    const hash = document.getElementById("resHash") ? document.getElementById("resHash").innerText : "SK-15Q-RESULT";

    // Admin Number (International Format: +923163632003)
    const adminPhone = "923172600127";

    // 2. Message Format
    const text = `🎯 *آن لائن کوئز رزلٹ*\n\n` +
                 `👤 *نام:* ${name}\n` +
                 `✅ *صحیح جوابات:* ${score}/${total}\n` +
                 `📊 *فیصد:* ${percent}%\n` +
                 `🔒 *سیکیورٹی ہیش:* ${hash}\n\n` +
                 `السلام علیکم! میں نے کوئز مکمل کر لیا ہے، میرا رزلٹ دیکھیں۔`;

    // 3. Admin direct number link
    const whatsappUrl = `https://wa.me/${adminPhone}?text=${encodeURIComponent(text)}`;

    // 4. Open WhatsApp directly
    window.location.href = whatsappUrl;
          
        }
    </script>
</body>
</html>
